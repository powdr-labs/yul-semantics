name = "yul-semantics"
version = "0.1.0"
# Only the library is a default target: building the `yul-semantics` exe (a placeholder) also
# compiles + links native object code for every transitively imported module. Build the exe
# explicitly with `lake build yul-semantics` if needed.
defaultTargets = ["YulSemantics"]
# `lake lint` runs the Batteries environment linters (docBlame, unusedArguments, …).
lintDriver = "batteries/runLinter"

# Turn Lean compiler warnings (unused variables, deprecations, `sorry`, …) into build errors.
[leanOptions]
warningAsError = true

# Batteries (not Mathlib!) is the only dependency, kept solely for the `runLinter` driver above.
# No library module imports it, so none of it is linked into downstream executables.
[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "YulSemantics"

[[lean_exe]]
name = "yul-semantics"
root = "Main"
